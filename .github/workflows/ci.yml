name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore RagAssistant.slnx

      - name: Build
        run: dotnet build RagAssistant.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format RagAssistant.slnx --verify-no-changes --no-restore

      # Integration tests start PostgreSQL through Testcontainers (Docker is preinstalled on ubuntu-latest).
      # --coverage is built into the Microsoft Testing Platform extension that TUnit ships; Cobertura files land next to the HTML test reports.
      - name: Test
        run: >
          dotnet test --solution RagAssistant.slnx --no-build -c Release
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      # Report only, no threshold: the table is added to the run summary.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/coverage-summary.py TestResults >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14
          if-no-files-found: ignore
